name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to read the previous tag's lock for the "changed since" list.
          fetch-depth: 0

      - name: Shell syntax and lint
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          bash -n install-switchvn.sh
          bash -n uninstall-switchvn.sh
          shellcheck -S warning install-switchvn.sh uninstall-switchvn.sh

      - name: Lock file format
        run: python3 .github/scripts/check_lock.py switchvn.lock

      - name: Tag matches SWITCHVN_VERSION
        # The tag, the lock and the release all name the same version, and a
        # mismatch here is how "which combination is 1.1?" stops having an
        # answer.
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(awk '$1 == "SWITCHVN_VERSION" { print $2; exit }' switchvn.lock)
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version $want, but the lock says $have"
            exit 1
          fi
          echo "ok   $GITHUB_REF_NAME matches SWITCHVN_VERSION $have"

      - name: Every locked asset is downloadable
        run: |
          fail=0
          while read -r name repo tag asset; do
            case "$name" in ''|\#*|SWITCHVN_VERSION) continue ;; esac
            [ -n "${asset:-}" ] || continue
            url="https://github.com/$repo/releases/download/$tag/$asset"
            code=$(curl -sIL -o /dev/null -w '%{http_code}' "$url")
            if [ "$code" = 200 ]; then
              printf 'ok   %-8s %s\n' "$name" "$tag"
            else
              echo "::error::$name asset is not downloadable: $url ($code)"
              fail=1
            fi
          done < switchvn.lock
          exit $fail

      - name: Cross-repository pins agree with the lock
        run: python3 .github/scripts/check_pins.py switchvn.lock

      - name: Build release notes
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            echo "previous tag: $prev"
            git show "$prev:switchvn.lock" > /tmp/prev.lock 2>/dev/null || true
          fi
          python3 .github/scripts/release_notes.py "$GITHUB_REF_NAME" /tmp/prev.lock > /tmp/notes.md
          cat /tmp/notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "SwitchVN ${GITHUB_REF_NAME#v}" \
                 --notes-file /tmp/notes.md \
                 --verify-tag
          gh release upload "$GITHUB_REF_NAME" switchvn.lock --clobber

      - name: Verify the lock is actually published
        # The installer resolves releases/latest/download/switchvn.lock, so a
        # release without this asset breaks every install rather than just
        # this one version.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' \
            | grep -qx 'switchvn.lock' \
            || { echo "::error::switchvn.lock is not attached to $GITHUB_REF_NAME"; exit 1; }
          echo "ok   switchvn.lock attached to $GITHUB_REF_NAME"
